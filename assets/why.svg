<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><style>
.h{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:30px;font-weight:800;fill:#fff}.s{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:16px;fill:#9FB6E0}
.ct{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:20px;font-weight:800;fill:#fff}.cd{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:14.5px;fill:#C7D4EE}.tg{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:12px;font-weight:700}
.c{opacity:0;animation:f .7s ease forwards}@keyframes f{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fl{animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-4px)}}
.shine{animation:sh 5s ease-in-out infinite}@keyframes sh{0%{transform:translateX(-400px)}60%,100%{transform:translateX(1600px)}}</style><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00E0B8"/><stop offset="1" stop-color="#4F8CFF"/></linearGradient></defs>
<rect width="1200" height="430" rx="22" fill="#0A1530"/><text x="40" y="54" class="h">🔥 Why Students Choose to Learn With Me</text><text x="40" y="82" class="s">Not just lectures. A complete journey from your first line of code to your first job.</text><g class="c" style="animation-delay:0.00s"><rect x="20" y="104" width="368" height="136" rx="18" fill="#101F45" stroke="#4F8CFF" stroke-opacity="0.35"/><rect x="44" y="104" width="320" height="4" rx="2" fill="url(#g)"/><text x="50" y="160" font-size="30">🧠</text><text x="100" y="156" class="ct">Concepts Made Simple</text><text x="50" y="194" class="cd">Hard topics explained in plain</text><text x="50" y="216" class="cd">Urdu and English, step by step</text></g><g class="c" style="animation-delay:0.15s"><rect x="416" y="104" width="368" height="136" rx="18" fill="#101F45" stroke="#4F8CFF" stroke-opacity="0.35"/><rect x="440" y="104" width="320" height="4" rx="2" fill="url(#g)"/><text x="446" y="160" font-size="30">🛠️</text><text x="496" y="156" class="ct">Learn by Building</text><text x="446" y="194" class="cd">Every class ends in working code,</text><text x="446" y="216" class="cd">every semester in a real project</text></g><g class="c" style="animation-delay:0.30s"><rect x="812" y="104" width="368" height="136" rx="18" fill="#101F45" stroke="#4F8CFF" stroke-opacity="0.35"/><rect x="836" y="104" width="320" height="4" rx="2" fill="url(#g)"/><text x="842" y="160" font-size="30">🚀</text><text x="892" y="156" class="ct">Industry-Ready Skills</text><text x="842" y="194" class="cd">Current tech the market hires for:</text><text x="842" y="216" class="cd">React, .NET, Flutter, AI, cloud</text></g><g class="c" style="animation-delay:0.45s"><rect x="20" y="264" width="368" height="136" rx="18" fill="#101F45" stroke="#4F8CFF" stroke-opacity="0.35"/><rect x="44" y="264" width="320" height="4" rx="2" fill="url(#g)"/><text x="50" y="320" font-size="30">🤝</text><text x="100" y="316" class="ct">Personal Mentoring</text><text x="50" y="354" class="cd">I know every student by name</text><text x="50" y="376" class="cd">and guide each one to the finish</text></g><g class="c" style="animation-delay:0.60s"><rect x="416" y="264" width="368" height="136" rx="18" fill="#101F45" stroke="#4F8CFF" stroke-opacity="0.35"/><rect x="440" y="264" width="320" height="4" rx="2" fill="url(#g)"/><text x="446" y="320" font-size="30">📂</text><text x="496" y="316" class="ct">Job-Ready Portfolio</text><text x="446" y="354" class="cd">Every project lives on GitHub,</text><text x="446" y="376" class="cd">ready for employers and clients</text></g><g class="c" style="animation-delay:0.75s"><rect x="812" y="264" width="368" height="136" rx="18" fill="#101F45" stroke="#4F8CFF" stroke-opacity="0.35"/><rect x="836" y="264" width="320" height="4" rx="2" fill="url(#g)"/><text x="842" y="320" font-size="30">🏆</text><text x="892" y="316" class="ct">Proven Leadership</text><text x="842" y="354" class="cd">Senior Faculty &amp; Manager Academics</text><text x="842" y="376" class="cd">leading a full faculty team</text></g><defs><linearGradient id="shg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="shc"><rect width="1200" height="430" rx="22"/></clipPath></defs><g clip-path="url(#shc)"><rect class="shine" x="0" y="-50" width="260" height="530" fill="url(#shg)" transform="skewX(-20)"/></g></svg>