<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="538" viewBox="0 0 1200 538"><style>
.h{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:30px;font-weight:800;fill:#fff}.s{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:16px;fill:#9FB6E0}
.ct{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:20px;font-weight:800;fill:#fff}.cd{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:14.5px;fill:#C7D4EE}.tg{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:12px;font-weight:700}
.c{opacity:0;animation:f .7s ease forwards}@keyframes f{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fl{animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-4px)}}
.shine{animation:sh 5s ease-in-out infinite}@keyframes sh{0%{transform:translateX(-400px)}60%,100%{transform:translateX(1600px)}}</style><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00E0B8"/><stop offset="1" stop-color="#4F8CFF"/></linearGradient></defs>
<rect width="1200" height="538" rx="22" fill="#0A1530"/><text x="40" y="54" class="h">🎯 Every Student Has a Path With Me</text><text x="40" y="82" class="s">Whoever you are and wherever you start, there is a track built for you.</text><g class="c" style="animation-delay:0.00s"><rect x="20" y="104" width="368" height="190" rx="18" fill="#101F45" stroke="#FFD43B" stroke-opacity="0.55"/><rect x="30" y="122" width="5" height="154" rx="2.5" fill="#FFD43B"/><g class="fl" style="transform-origin:64px 150px"><circle cx="64" cy="150" r="24" fill="#FFD43B" fill-opacity="0.16"/><text x="64" y="159" text-anchor="middle" font-size="24">🎒</text></g><text x="102" y="144" class="ct">School &amp; College</text><text x="102" y="166" class="tg" fill="#FFD43B">BEGINNER · CPISM</text><text x="46" y="204" class="cd">▸ Start from zero: no experience needed</text><text x="46" y="228" class="cd">▸ HTML, CSS, JavaScript, first website</text><text x="46" y="252" class="cd">▸ Matric / Inter to IT career</text></g><g class="c" style="animation-delay:0.15s"><rect x="416" y="104" width="368" height="190" rx="18" fill="#101F45" stroke="#4F8CFF" stroke-opacity="0.55"/><rect x="426" y="122" width="5" height="154" rx="2.5" fill="#4F8CFF"/><g class="fl" style="transform-origin:460px 150px"><circle cx="460" cy="150" r="24" fill="#4F8CFF" fill-opacity="0.16"/><text x="460" y="159" text-anchor="middle" font-size="24">🎓</text></g><text x="498" y="144" class="ct">University Students</text><text x="498" y="166" class="tg" fill="#4F8CFF">INTERMEDIATE · HDSE</text><text x="442" y="204" class="cd">▸ Fill the gap between theory and jobs</text><text x="442" y="228" class="cd">▸ React, ASP.NET, Laravel, real projects</text><text x="442" y="252" class="cd">▸ Final-year project guidance</text></g><g class="c" style="animation-delay:0.30s"><rect x="812" y="104" width="368" height="190" rx="18" fill="#101F45" stroke="#22C55E" stroke-opacity="0.55"/><rect x="822" y="122" width="5" height="154" rx="2.5" fill="#22C55E"/><g class="fl" style="transform-origin:856px 150px"><circle cx="856" cy="150" r="24" fill="#22C55E" fill-opacity="0.16"/><text x="856" y="159" text-anchor="middle" font-size="24">💼</text></g><text x="894" y="144" class="ct">Job Seekers</text><text x="894" y="166" class="tg" fill="#22C55E">CAREER · ADSE</text><text x="838" y="204" class="cd">▸ Portfolio-ready projects on GitHub</text><text x="838" y="228" class="cd">▸ Interview and CV preparation</text><text x="838" y="252" class="cd">▸ Industry tools: Git, APIs, cloud</text></g><g class="c" style="animation-delay:0.45s"><rect x="20" y="318" width="368" height="190" rx="18" fill="#101F45" stroke="#FF8C42" stroke-opacity="0.55"/><rect x="30" y="336" width="5" height="154" rx="2.5" fill="#FF8C42"/><g class="fl" style="transform-origin:64px 364px"><circle cx="64" cy="364" r="24" fill="#FF8C42" fill-opacity="0.16"/><text x="64" y="373" text-anchor="middle" font-size="24">💸</text></g><text x="102" y="358" class="ct">Freelancers</text><text x="102" y="380" class="tg" fill="#FF8C42">EARN ONLINE</text><text x="46" y="418" class="cd">▸ Custom business websites</text><text x="46" y="442" class="cd">▸ Mobile apps with Flutter</text><text x="46" y="466" class="cd">▸ Client-ready full-stack skills</text></g><g class="c" style="animation-delay:0.60s"><rect x="416" y="318" width="368" height="190" rx="18" fill="#101F45" stroke="#B388FF" stroke-opacity="0.55"/><rect x="426" y="336" width="5" height="154" rx="2.5" fill="#B388FF"/><g class="fl" style="transform-origin:460px 364px"><circle cx="460" cy="364" r="24" fill="#B388FF" fill-opacity="0.16"/><text x="460" y="373" text-anchor="middle" font-size="24">🔄</text></g><text x="498" y="358" class="ct">Career Switchers</text><text x="498" y="380" class="tg" fill="#B388FF">NEW START</text><text x="442" y="418" class="cd">▸ From any field into software</text><text x="442" y="442" class="cd">▸ Structured step-by-step path</text><text x="442" y="466" class="cd">▸ Practical, not just theory</text></g><g class="c" style="animation-delay:0.75s"><rect x="812" y="318" width="368" height="190" rx="18" fill="#101F45" stroke="#00E0B8" stroke-opacity="0.55"/><rect x="822" y="336" width="5" height="154" rx="2.5" fill="#00E0B8"/><g class="fl" style="transform-origin:856px 364px"><circle cx="856" cy="364" r="24" fill="#00E0B8" fill-opacity="0.16"/><text x="856" y="373" text-anchor="middle" font-size="24">🤖</text></g><text x="894" y="358" class="ct">Data Science &amp; AI</text><text x="894" y="380" class="tg" fill="#00E0B8">ADVANCED · DS / AI</text><text x="838" y="418" class="cd">▸ Python, Pandas, statistics</text><text x="838" y="442" class="cd">▸ Machine learning and AI basics</text><text x="838" y="466" class="cd">▸ Hadoop, Hive and Spark big data</text></g><defs><linearGradient id="shg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="shc"><rect width="1200" height="538" rx="22"/></clipPath></defs><g clip-path="url(#shc)"><rect class="shine" x="0" y="-50" width="260" height="638" fill="url(#shg)" transform="skewX(-20)"/></g></svg>