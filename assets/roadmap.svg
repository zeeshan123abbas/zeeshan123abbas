<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250"><style>.h{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:26px;font-weight:800;fill:#fff}.n{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:800;fill:#0A1530}.t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:800}.d{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:14px;fill:#C7D4EE}
.ln{stroke-dasharray:1000;stroke-dashoffset:1000;animation:dr 2.5s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.c{opacity:0;animation:f .6s ease forwards}@keyframes f{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.dot{animation:mv 6s linear infinite}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(1000px)}}</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FFD43B"/><stop offset=".5" stop-color="#4F8CFF"/><stop offset="1" stop-color="#22C55E"/></linearGradient></defs>
<rect width="1200" height="250" rx="22" fill="#0A1530"/><text x="40" y="50" class="h">🗺️ Your Journey: Zero to Career</text>
<line x1="100" y1="140" x2="1100" y2="140" stroke="#1B2A4E" stroke-width="8" stroke-linecap="round"/>
<line x1="100" y1="140" x2="1100" y2="140" stroke="url(#g)" stroke-width="8" stroke-linecap="round" class="ln"/>
<circle cx="100" cy="140" r="7" fill="#fff" class="dot"/><g class="c" style="animation-delay:0.30s;transform-origin:100px 140px"><circle cx="100" cy="140" r="30" fill="#FFD43B"/><circle cx="100" cy="140" r="38" fill="none" stroke="#FFD43B" stroke-opacity="0.4" stroke-width="2"/><text x="100" y="147" text-anchor="middle" class="n">01</text><text x="100" y="200" text-anchor="middle" class="t" fill="#FFD43B">CPISM</text><text x="100" y="222" text-anchor="middle" class="d">Web Designer</text></g><g class="c" style="animation-delay:0.65s;transform-origin:300px 140px"><circle cx="300" cy="140" r="30" fill="#FF8C42"/><circle cx="300" cy="140" r="38" fill="none" stroke="#FF8C42" stroke-opacity="0.4" stroke-width="2"/><text x="300" y="147" text-anchor="middle" class="n">02</text><text x="300" y="200" text-anchor="middle" class="t" fill="#FF8C42">DISM</text><text x="300" y="222" text-anchor="middle" class="d">Programmer</text></g><g class="c" style="animation-delay:1.00s;transform-origin:500px 140px"><circle cx="500" cy="140" r="30" fill="#4F8CFF"/><circle cx="500" cy="140" r="38" fill="none" stroke="#4F8CFF" stroke-opacity="0.4" stroke-width="2"/><text x="500" y="147" text-anchor="middle" class="n">03</text><text x="500" y="200" text-anchor="middle" class="t" fill="#4F8CFF">HDSE</text><text x="500" y="222" text-anchor="middle" class="d">Full-Stack Dev</text></g><g class="c" style="animation-delay:1.35s;transform-origin:700px 140px"><circle cx="700" cy="140" r="30" fill="#B388FF"/><circle cx="700" cy="140" r="38" fill="none" stroke="#B388FF" stroke-opacity="0.4" stroke-width="2"/><text x="700" y="147" text-anchor="middle" class="n">04</text><text x="700" y="200" text-anchor="middle" class="t" fill="#B388FF">ADSE</text><text x="700" y="222" text-anchor="middle" class="d">Mobile &amp; Cloud</text></g><g class="c" style="animation-delay:1.70s;transform-origin:900px 140px"><circle cx="900" cy="140" r="30" fill="#00E0B8"/><circle cx="900" cy="140" r="38" fill="none" stroke="#00E0B8" stroke-opacity="0.4" stroke-width="2"/><text x="900" y="147" text-anchor="middle" class="n">05</text><text x="900" y="200" text-anchor="middle" class="t" fill="#00E0B8">DS &amp; AI</text><text x="900" y="222" text-anchor="middle" class="d">Data Scientist</text></g><g class="c" style="animation-delay:2.05s;transform-origin:1100px 140px"><circle cx="1100" cy="140" r="30" fill="#22C55E"/><circle cx="1100" cy="140" r="38" fill="none" stroke="#22C55E" stroke-opacity="0.4" stroke-width="2"/><text x="1100" y="147" text-anchor="middle" class="n">🏆</text><text x="1100" y="200" text-anchor="middle" class="t" fill="#22C55E">CAREER</text><text x="1100" y="222" text-anchor="middle" class="d">Job · Freelance</text></g></svg>