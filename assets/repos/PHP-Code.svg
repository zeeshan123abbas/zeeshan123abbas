<svg xmlns="http://www.w3.org/2000/svg" width="580" height="190" viewBox="0 0 580 190"><style>
.t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:21px;font-weight:800;fill:#fff}.d{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:14px;fill:#C7D4EE}.c{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:12px;font-weight:700}.m{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:13px;fill:#9FB6E0}.cta{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:800;fill:#9AA6FF}
.bd{stroke-dasharray:120 1500;animation:bd 4s linear infinite}@keyframes bd{to{stroke-dashoffset:-1620}}
.fl{animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-5px)}}
.ar{animation:ar 1.4s ease-in-out infinite}@keyframes ar{50%{transform:translateX(5px)}}
