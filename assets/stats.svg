<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170"><style>.n{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:46px}.l{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:16px;fill:#9FB6E0;font-weight:600}.c{opacity:0;animation:f .8s ease forwards}@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.shine{animation:sh 5s ease-in-out infinite}@keyframes sh{0%{transform:translateX(-400px)}60%,100%{transform:translateX(1600px)}}</style>
