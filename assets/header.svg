.spin{transform-origin:960px 190px;animation:s 40s linear infinite}
.spinr{transform-origin:960px 190px;animation:s 28s linear infinite reverse}
@keyframes s{to{transform:rotate(360deg)}}
.pulse{animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{opacity:.35}}
.cur{animation:p 1s steps(1) infinite}
.hb{transform-origin:960px 190px;animation:hb 3s ease-in-out infinite}@keyframes hb{50%{transform:scale(1.08)}}.ul{transform-origin:62px 181px;animation:ul 4s ease-in-out infinite}@keyframes ul{0%,100%{transform:scaleX(.4)}50%{transform:scaleX(2.6)}}.shine{animation:sh 5s ease-in-out infinite}@keyframes sh{0%{transform:translateX(-400px)}60%,100%{transform:translateX(1600px)}}</style>
