<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1A3A"/><stop offset="0.55" stop-color="#0E2A6B"/><stop offset="1" stop-color="#062D3F"/></linearGradient>
<linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#00E0B8"/><stop offset="1" stop-color="#4F8CFF"/></linearGradient>
<radialGradient id="glow" cx="0.82" cy="0.45" r="0.45"><stop offset="0" stop-color="#4F8CFF" stop-opacity="0.45"/><stop offset="1" stop-color="#4F8CFF" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
<style>
.t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#fff}
.fade{opacity:0;animation:f 1s ease forwards}
.d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}.d4{animation-delay:1.4s}.d5{animation-delay:1.8s}
@keyframes f{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.spin{transform-origin:960px 190px;animation:s 40s linear infinite}
.spinr{transform-origin:960px 190px;animation:s 28s linear infinite reverse}
@keyframes s{to{transform:rotate(360deg)}}
.pulse{animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{opacity:.35}}
.cur{animation:p 1s steps(1) infinite}
</style>
</defs>
<rect width="1200" height="380" rx="22" fill="url(#bg)"/>
