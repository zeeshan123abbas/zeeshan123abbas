<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><style>.h{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:24px;font-weight:800;fill:#fff}.s{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:14px;fill:#9FB6E0}.l{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:700;fill:#C7D4EE}.v{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:800}.big{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:34px;font-weight:800;fill:#fff}
.grow{transform:scale(0);animation:gr 7s cubic-bezier(.2,.8,.2,1) infinite}@keyframes gr{0%{transform:scale(0)}25%{transform:scale(1)}45%{transform:scale(.93)}65%{transform:scale(1)}85%{transform:scale(1)}100%{transform:scale(0)}}
